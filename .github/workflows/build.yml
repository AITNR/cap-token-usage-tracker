name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (e.g. 1.2.6 or 1.2.6-alpha.1)"
        required: false
      release:
        description: "Publish a stable release after build"
        type: boolean
        default: false
      alpha:
        description: "Publish an alpha pre-release (adds -alpha.<run number> when needed)"
        type: boolean
        default: false

env:
  PLUGIN_ID: cap-token-usage-tracker

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Resolve version and release channel
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE: ${{ inputs.release }}
          INPUT_ALPHA: ${{ inputs.alpha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          publish=false
          prerelease=false

          next_patch_version() {
            local response status latest_tag major minor patch
            if ! response=$(curl --silent --show-error \
              --retry 3 \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --write-out $'\n%{http_code}' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/latest"); then
              echo "Unable to read the latest GitHub release." >&2
              exit 1
            fi

            status=${response##*$'\n'}
            if [[ "$status" == "404" ]]; then
              printf '0.0.1'
              return
            fi
            if [[ "$status" != "200" ]]; then
              echo "Unable to read the latest GitHub release (HTTP $status)." >&2
              exit 1
            fi

            latest_tag=$(printf '%s' "${response%$'\n'*}" | jq --raw-output '.tag_name')

            if [[ ! "$latest_tag" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Latest release tag is not a stable semantic version: $latest_tag" >&2
              exit 1
            fi

            major=${BASH_REMATCH[1]}
            minor=${BASH_REMATCH[2]}
            patch=${BASH_REMATCH[3]}
            printf '%s.%s.%s' "$major" "$minor" "$((patch + 1))"
          }

          if [[ "$REF_TYPE" == "tag" ]]; then
            version="${REF_NAME#v}"
            publish=true
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#v}"
            if [[ -z "$version" ]]; then
              version=$(next_patch_version)
            fi
            if [[ "$INPUT_ALPHA" == "true" ]]; then
              if [[ "$version" != *-* ]]; then
                version="${version}-alpha.${GITHUB_RUN_NUMBER}"
              fi
              publish=true
              prerelease=true
            elif [[ "$INPUT_RELEASE" == "true" ]]; then
              publish=true
            fi
          else
            version="$(next_patch_version)-alpha.${GITHUB_RUN_NUMBER}"
            publish=true
            prerelease=true
          fi

          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version (publish=$publish, prerelease=$prerelease)"

  build-windows-amd64:
    name: Windows amd64 (.dll)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install MinGW-w64
        run: choco install mingw -y

      - name: Build DLL
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "1"
          $version = "${{ needs.prepare.outputs.version }}"
          go build -buildmode=c-shared -trimpath -buildvcs=false `
            -ldflags="-s -w -X main.version=$version" `
            -o "${{ env.PLUGIN_ID }}.dll" .

      - name: Create zip
        shell: pwsh
        run: |
          $zipName = "${{ env.PLUGIN_ID }}_${{ needs.prepare.outputs.version }}_windows_amd64.zip"
          Compress-Archive -Path "${{ env.PLUGIN_ID }}.dll" -DestinationPath $zipName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          path: ${{ env.PLUGIN_ID }}_${{ needs.prepare.outputs.version }}_windows_amd64.zip

  build-linux-amd64:
    name: Linux amd64 (.so)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build .so
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          go build -buildmode=c-shared -trimpath -buildvcs=false \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "${{ env.PLUGIN_ID }}.so" .

      - name: Create zip
        run: |
          zipName="${{ env.PLUGIN_ID }}_${{ needs.prepare.outputs.version }}_linux_amd64.zip"
          zip "$zipName" "${{ env.PLUGIN_ID }}.so"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: ${{ env.PLUGIN_ID }}_${{ needs.prepare.outputs.version }}_linux_amd64.zip

  build-macos-arm64:
    name: macOS arm64 (.dylib)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build .dylib
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: arm64
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          go build -buildmode=c-shared -trimpath -buildvcs=false \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "${{ env.PLUGIN_ID }}.dylib" .

      - name: Verify .dylib and default data path
        run: bash scripts/verify-darwin-arm64.sh "${{ env.PLUGIN_ID }}.dylib"

      - name: Create zip
        run: |
          zipName="${{ env.PLUGIN_ID }}_${{ needs.prepare.outputs.version }}_darwin_arm64.zip"
          zip "$zipName" "${{ env.PLUGIN_ID }}.dylib"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin-arm64
          path: ${{ env.PLUGIN_ID }}_${{ needs.prepare.outputs.version }}_darwin_arm64.zip

  build-linux-arm64:
    name: Linux arm64 (.so)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install aarch64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build .so
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: arm64
          CC: aarch64-linux-gnu-gcc
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          go build -buildmode=c-shared -trimpath -buildvcs=false \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "${{ env.PLUGIN_ID }}.so" .

      - name: Create zip
        run: |
          zipName="${{ env.PLUGIN_ID }}_${{ needs.prepare.outputs.version }}_linux_arm64.zip"
          zip "$zipName" "${{ env.PLUGIN_ID }}.so"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: ${{ env.PLUGIN_ID }}_${{ needs.prepare.outputs.version }}_linux_arm64.zip

  release:
    name: Create Release
    needs: [ prepare, build-windows-amd64, build-linux-amd64, build-linux-arm64, build-macos-arm64 ]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.publish == 'true'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: find artifacts -type f

      - name: Generate checksums.txt
        run: |
          cd artifacts
          sha256sum *.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.prerelease == 'true' && 'Test Release' || 'Release' }} v${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/checksums.txt
